name: CLI npm packages

on:
  pull_request:
    paths:
      - "package.json"
      - "npm/**"
      - "scripts/*npm*.cjs"
      - "scripts/package-cli.cjs"
      - "tests/npm-*.test.cjs"
      - "rust/**"
      - ".github/workflows/cli-npm.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "package.json"
      - "npm/**"
      - "scripts/*npm*.cjs"
      - "scripts/package-cli.cjs"
      - "tests/npm-*.test.cjs"
      - "rust/**"
      - ".github/workflows/cli-npm.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this version to npm (requires NPM_TOKEN)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: CLI (${{ matrix.key }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: darwin-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            binary: tokenmarket
          - key: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: tokenmarket
          - key: win32-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: tokenmarket.exe
          - key: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: tokenmarket
          - key: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            binary: tokenmarket
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: rust/tokensmarket-cli
      - name: Test npm launcher
        run: npm test
      - name: Test CLI
        run: cargo test --locked --manifest-path rust/tokensmarket-cli/Cargo.toml
      - name: Build CLI
        run: cargo build --release --locked --manifest-path rust/tokensmarket-cli/Cargo.toml --target ${{ matrix.target }}
      - name: Stage platform package
        run: npm run package:platform -- ${{ matrix.key }} rust/tokensmarket-cli/target/${{ matrix.target }}/release/${{ matrix.binary }}
      - name: Pack platform tarball
        run: npm pack ./dist/npm/tokenmarket-${{ matrix.key }} --pack-destination dist --ignore-scripts
      - name: Verify actual npx installation
        run: npm run test:package -- dist
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.key }}
          path: dist/*.tgz
          if-no-files-found: error

  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: dist/packages
          merge-multiple: true
      - run: npm pack --pack-destination dist/packages --ignore-scripts
      - name: Validate complete release
        run: npm run publish:cli -- dist/packages --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release
          path: dist/packages/*.tgz
          if-no-files-found: error

  publish:
    needs: assemble
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-release
          path: dist/packages
      - name: Check npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami
      # Platform packages must be available before the public launcher is published.
      - name: Publish platform packages, then launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: npm run publish:cli -- dist/packages
