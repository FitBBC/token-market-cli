const initialTools = [
 {id:'claude',name:'Claude Code',installed:true,connected:true,state:'pass',space:'个人空间',kind:'命令行工具',protocol:'Anthropic Messages'},
 {id:'codex',name:'Codex CLI',installed:true,connected:true,state:'configured',space:'个人空间',kind:'命令行工具',protocol:'OpenAI Responses'},
 {id:'workbuddy',name:'WorkBuddy',installed:true,connected:false,state:'ready',space:null,kind:'桌面工具',protocol:'Chat Completions'},
 {id:'deepseek',name:'DeepSeek Harness',installed:false,connected:false,state:'missing',space:null,kind:'桌面 / 命令行',protocol:'Chat Completions'},
 {id:'openclaw',name:'OpenClaw',installed:false,connected:false,state:'missing',space:null,kind:'Agent 工具',protocol:'Chat Completions'},
 {id:'opencode',name:'OpenCode',installed:false,connected:false,state:'missing',space:null,kind:'桌面 / 命令行',protocol:'Chat Completions'}
];
let tools=structuredClone(initialTools), currentSpace='个人空间', page='tools', selected='claude', filter='all', query='', timer, operationTimer;
let signedIn=true, loginState='initial', inventoryState='ready', balanceError=false, testOutcome='pass', disconnectConflict=false, busy=false;
let appearance={density:'comfortable',accent:'blue'};
try{appearance={...appearance,...JSON.parse(localStorage.getItem('token-market-lightweight-design')||'{}')}}catch(_){}
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], dialog=$('#dialog');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toolById=id=>tools.find(t=>t.id===id);
const icon=name=>`<svg aria-hidden="true"><use href="#${name}"/></svg>`;
const button=(label,action,id='',style='')=>`<button class="${style}" data-action="${action}" ${id?`data-id="${id}"`:''}>${label}</button>`;
function label(t){return({pass:'文本测试通过',fail:'文本测试失败',changed:'配置已改变或不可用',configured:'已配置，未测试',ready:'已安装，尚未接入',missing:'未安装'})[t.state]}
function state(t){return `<span class="state ${t.state}"><i class="dot"></i>${label(t)}</span>`}
function toast(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('#toast').hidden=true,3800)}
function applyAppearance(){document.body.classList.toggle('body-compact',appearance.density==='compact');document.body.classList.toggle('theme-teal',appearance.accent==='teal');try{localStorage.setItem('token-market-lightweight-design',JSON.stringify(appearance))}catch(_){}}
function modal(title,body,actions='',id=''){
 if(dialog.open)dialog.close();
 $('#dialog-body').innerHTML=`<div class="dialog-head">${id?`<img src="${assets[id].data}" alt="">`:''}<h2 id="dialog-title">${title}</h2><button class="close-icon" data-action="close" aria-label="关闭">×</button></div>${body}${actions?`<div class="dialog-footer">${actions}</div>`:''}`;
 dialog.showModal();
}

function home(){
 const shown=tools.filter(t=>(filter==='all'||filter==='connected'&&t.connected||filter==='available'&&t.installed&&!t.connected)&&(t.name+' glm-5.3').toLowerCase().includes(query));
 const counts={all:tools.length,connected:tools.filter(t=>t.connected).length,available:tools.filter(t=>t.installed&&!t.connected).length};
 let content=shown.map(card).join('');
 if(inventoryState==='loading')content=Array.from({length:6},()=>'<article class="card loading-cards" aria-hidden="true"><div class="card-top"><div class="tool-icon"></div><div style="flex:1"><div class="skeleton"></div><div class="skeleton short"></div></div></div><div class="card-body"><div class="skeleton"></div><div class="skeleton short"></div></div></article>').join('');
 else if(inventoryState==='error')content=`<div class="empty-state"><h2>暂时无法检测本机工具</h2><p>未能读取安装状态，请重新检测。</p>${button('重新检测','detect','','primary')}</div>`;
 else if(!shown.length)content=`<div class="empty-state">${icon('search')}<h2>没有匹配的工具</h2><p>${query?'试试其他工具名称，或清空搜索。':'这个分类下还没有工具，查看全部工具开始接入。'}</p>${button('查看全部工具','clear-search','','primary')}</div>`;
 return `<header class="heading"><div><h1>你的 Agent</h1><p>连接本机工具，在熟悉的地方开始工作。</p></div><button class="refresh" data-action="detect" ${inventoryState==='loading'?'disabled':''}>${icon('refresh')}${inventoryState==='loading'?'检测中…':'重新检测'}</button></header>${workspaceStrip()}<div class="filters"><div class="tabs" role="group" aria-label="按状态筛选">${[['all','全部'],['connected','已接入'],['available','待接入']].map(([v,n])=>`<button data-filter="${v}" class="${filter===v?'selected':''}" aria-pressed="${filter===v}">${n}<span>${counts[v]}</span></button>`).join('')}</div><label class="search">${icon('search')}<input id="search-input" type="search" aria-label="搜索工具" placeholder="搜索工具或模型" value="${esc(query)}"></label></div><div class="scan-feedback" role="status">${inventoryState==='loading'?'正在检查本机安装状态…':inventoryState==='error'?'工具列表加载失败':'已检测到 '+tools.filter(t=>t.installed).length+' 款已安装工具'}</div><section class="tools" aria-label="本机 Agent">${content}</section><footer class="hint">${icon('help')}<span>切换当前空间不会改变已有连接的计费空间。</span><a href="#help" data-action="nav" data-page="help" class="shell-link">了解接入流程</a></footer>`;
}
function detail(){const t=toolById(selected);
 const note=t.state==='pass'?['pass','已验证一次完整文本输出','本次记录仅代表该模型的一次文本响应；其他 Agent 功能需在工具中确认。']:t.state==='fail'?['error','文本输出测试失败','模型暂未返回有效响应。检查余额、权限与模型可用性后，可重新测试。']:t.state==='changed'?['','配置发生变化，请先检查','当前配置与接入时的记录不一致，测试已停用。检查配置或重新接入后再试。']:['','接入已完成，尚未测试','配置已写入。可以先打开工具；需要确认模型响应时，再发起一次文本测试。'];
 return `<header class="heading detail-heading"><div class="detail-title"><div class="tool-icon"><img src="${assets[t.id].data}" alt=""></div><div><h1>${t.name}</h1><p>${t.kind}</p></div></div>${button('返回工具列表','nav','','quiet').replace('data-action="nav"','data-action="nav" data-page="tools"')}</header>${t.connected?`<div class="alert ${note[0]}"><h3>${note[1]}</h3><p>${note[2]}</p></div><div class="detail-actions">${button('打开工具','launch',t.id,'primary')}<button data-action="test" data-id="${t.id}" ${t.state==='changed'?'disabled title="请先检查配置或重新接入"':''}>测试连接</button><details class="manage"><summary>管理连接</summary><div class="manage-menu">${button('重新接入','connect',t.id)}${button('取消接入','disconnect',t.id,'danger')}</div></details></div>`:`<div class="notice">${t.installed?'工具已安装，接入后即可使用 Token Market 模型。':'先安装工具，再回来重新检测和接入。'}</div><div class="detail-actions">${button(t.installed?'接入 Token Market':'查看安装指引',t.installed?'connect':'download',t.id,'primary')}</div>`}<div class="detail-layout"><div><section class="sheet"><h2>${t.connected?'已配置模型':'接入模型示例'}</h2><div class="model-entry"><div><code>glm-5.3</code><small>文本生成模型</small></div><span class="tag">${t.connected?'已配置':'示例'}</span></div><p class="subline">${t.connected?'模型测试需单独确认，可能产生少量费用。':'实际可用模型取决于接入空间的权限与模型目录。'}</p></section><section class="sheet"><h2>使用前提醒</h2><p>配置完成后，请完全退出并重新打开已有的工具会话。</p><p>${t.id==='openclaw'?'OpenClaw 需要重启 Gateway 或会话才能读取新配置。':t.id==='opencode'?'项目中的配置可能覆盖全局模型设置。':'如果工具已有模型选择，请在工具中确认当前使用的模型。'}</p></section></div><section class="sheet"><h2>连接归属</h2><div class="row"><span>所属账号</span><strong>${t.connected?'演示账号':'接入时确定'}</strong></div><div class="row"><span>计费空间</span><strong>${t.connected?t.space:'尚未接入'}</strong></div><div class="row"><span>连接状态</span>${state(t)}</div><div class="row"><span>安装状态</span><strong>${t.installed?'已安装':'未安装'}</strong></div><p class="context-note">${t.connected?`已有连接保留自己的计费空间。${t.space!==currentSpace?`若要改用「${currentSpace}」，请确认重新接入。`:'更换空间时，请确认重新接入。'}`:'接入后，工具使用本次确认的计费空间。'}</p><details class="faq"><summary>查看接入信息</summary><p>连接协议：${t.protocol}<br>模型标识：glm-5.3<br>Key 不在界面中显示。</p></details></section></div>`;
}

function helpPage(){return `<header class="heading"><div><h1>使用帮助</h1><p>从接入到开始工作，只需要几步。</p></div></header><div class="page-grid"><section class="sheet"><h2>开始使用</h2><ol class="timeline"><li><span class="step-dot"></span><h3>安装你常用的工具</h3><p>已安装的工具会出现在首页。安装完成后，点击重新检测。</p></li><li><span class="step-dot"></span><h3>确认空间，然后接入</h3><p>接入会配置模型。当前空间用于这次新连接的计费归属。</p></li><li><span class="step-dot"></span><h3>重新打开工具</h3><p>已有会话请先退出，让工具读取新的模型配置。</p></li><li><span class="step-dot"></span><h3>需要时，测试一次</h3><p>连接详情中可发起文本测试，确认费用后才发送请求。</p></li></ol></section><section class="sheet"><h2>常见问题</h2><details class="faq" open><summary>接入后为什么显示“未测试”？</summary><p>接入只配置工具，不会自动发送模型请求。测试由你单独发起，可能产生费用。</p></details><details class="faq"><summary>切换空间会影响已有工具吗？</summary><p>已有工具保持自己的计费空间。需要更换归属时，在连接详情中重新接入并确认目标空间。</p></details><details class="faq"><summary>退出登录会删除工具配置吗？</summary><p>不会。退出桌面账号不会重写已有 Agent 配置。</p></details><details class="faq"><summary>文本测试通过代表什么？</summary><p>表示一次完整文本输出成功。流式输出、工具调用和 Agent 运行表现需要在实际工具中确认。</p></details><details class="faq"><summary>为什么配置变化后不能测试？</summary><p>当前配置可能与接入记录不一致。请检查配置或重新接入，以确保测试使用正确的连接。</p></details></section></div>`}
function render(){
 $('#app').classList.toggle('signed-out',!signedIn);$('#main').classList.toggle('home-page',page==='tools');if(!signedIn){renderLogin();return}
 const titles={tools:'我的 Agent',account:'账号与空间',help:'使用帮助',detail:toolById(selected).name};$('#breadcrumb').textContent='工作台 / '+titles[page];
 $$('[data-page]').forEach(n=>{const active=n.dataset.page===(page==='detail'?'tools':page);n.classList.toggle('active',active);if(active)n.setAttribute('aria-current','page');else n.removeAttribute('aria-current')});

 const search=$('#search-input');if(search)search.addEventListener('input',e=>{const pos=e.target.selectionStart;query=e.target.value.toLowerCase();render();const n=$('#search-input');n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}});
}

function testModal(t){const single=['claude','codex'].includes(t.id);modal('测试连接',`<p>将发送一次文本生成请求，可能产生少量费用。费用计入此工具的计费空间。</p><div class="dialog-meta"><div class="row"><span>工具</span><strong>${t.name}</strong></div><div class="row"><span>计费空间</span><strong>${t.space}</strong></div></div><label>本次测试模型<select id="test-model" ${single?'disabled':''}>${single?'':'<option value="">请选择一个已配置模型</option>'}<option value="glm-5.3">glm-5.3</option></select></label><p class="caption">仅验证一次完整文本输出。原型会模拟结果，不发出真实请求。</p>`,button('取消','close')+`<button class="primary" data-action="confirm-test" data-id="${t.id}" id="confirm-test" ${single?'':'disabled'}>确认费用并测试一次</button>`,t.id)}

function conflictModal(t){modal('配置内容发生冲突',`<p>接入后的配置有过修改。请明确选择如何处理这一项。</p><div class="dialog-meta"><div class="row"><span>冲突位置</span><strong>文件 1 / 配置项 1</strong></div></div><label>处理方式<select id="conflict-choice"><option value="">请选择处理方式</option><option value="keep">保留当前内容</option><option value="restore">恢复接入前的原值</option></select></label><p class="caption">这里只显示项目编号，避免暴露凭据。未选择时不会继续。</p>`,button('暂不取消接入','close')+'<button class="danger" id="confirm-conflict" data-action="finish-disconnect" data-id="'+t.id+'" disabled>按所选方式取消接入</button>',t.id)}
function preview(){const t=toolById(selected);modal('状态与外观',`<p>这些控制只用于体验原型，不影响真实账号或工具。</p><div class="preview-controls"><label>页面场景<select id="scene"><option value="normal">正常页面</option><option value="loading">工具检测中</option><option value="inventory-error">工具检测失败</option><option value="balance-error">余额读取失败</option><option value="login">登录页面</option><option value="login-waiting">等待浏览器授权</option><option value="login-error">登录失败</option><option value="login-success">模拟授权成功</option><option value="conflict">取消接入时配置冲突</option></select></label><label>当前工具连接状态 · ${t.name}<select id="demo-tool-state"><option value="keep">保持当前状态</option><option value="configured">已配置，未测试</option><option value="pass">文本测试通过</option><option value="fail">文本测试失败</option><option value="changed">配置已改变或不可用</option></select></label><label>下一次模拟测试结果<select id="demo-test-result"><option value="pass">通过</option><option value="fail">失败</option></select></label><label>界面密度<select id="density"><option value="comfortable">舒适</option><option value="compact">紧凑</option></select></label><label>强调色<select id="accent"><option value="blue">蓝色（选定方向）</option><option value="teal">青色（同方向变体）</option></select></label></div>`,button('取消','close')+button('应用预览','apply-preview','','primary'));$('#density').value=appearance.density;$('#accent').value=appearance.accent;$('#demo-test-result').value=testOutcome;}

function after(ms,fn){clearTimeout(operationTimer);operationTimer=setTimeout(()=>{busy=false;fn()},ms)}
document.addEventListener('click',e=>{
 const n=e.target.closest('[data-action],[data-filter]');if(!n||n.disabled||busy)return;if(n.tagName==='A')e.preventDefault();if(n.dataset.filter){filter=n.dataset.filter;render();return}
 const action=n.dataset.action,t=toolById(n.dataset.id);$$('.manage[open]').forEach(x=>x.open=false);
 switch(action){
 case'nav':setPage(n.dataset.page||'tools');break;
 case'close':dialog.close();break;
 case'detail':setPage('detail',t.id);break;
 case'workspace':workspaceModal();break;
 case'choose-space':currentSpace=n.dataset.space;if(dialog.open)dialog.close();render();toast('当前空间已切换；已有连接保留各自的计费空间。');break;
 case'connect':if(t.installed)connectModal(t);break;
 case'confirm-connect':{const target=currentSpace;progress('正在接入 '+t.name,'正在保存模型配置…');after(700,()=>{t.connected=true;t.state='configured';t.space=target;selected=t.id;page='detail';render();modal('接入完成',`<div class="success-mark">✓</div><p>${t.name} 已配置到「${target}」。</p><p>模型尚未测试。重新打开工具后，即可在工具中继续工作。</p>`,button('查看连接','close')+button('打开工具','launch',t.id,'primary'),t.id)});break}
 case'test':if(t.connected&&t.state!=='changed')testModal(t);break;
 case'confirm-test':{const model=$('#test-model').value;if(!model)break;const outcome=testOutcome,billed=t.space;progress('正在测试连接','正在等待一次完整文本响应…');after(850,()=>{t.state=outcome;render();modal(outcome==='pass'?'文本测试通过':'文本测试失败',`<div class="result-mark ${outcome==='fail'?'fail':''}">${outcome==='pass'?'✓':'!'}</div><p>${outcome==='pass'?'已模拟收到一次完整文本响应。':'未收到有效文本响应，请检查余额、权限与模型可用性。'}</p><div class="dialog-meta"><div class="row"><span>计费空间</span><strong>${billed}</strong></div><div class="row"><span>模型</span><strong class="result-model">${model}</strong></div></div><p class="caption">演示结果，不作为真实服务可用性证明。</p>`,button('完成','close','','primary')+(outcome==='fail'?button('重新测试','test',t.id):''),t.id)});break}
 case'launch':if(dialog.open)dialog.close();toast('已模拟请求打开 '+t.name+'；不会启动本机程序。');break;
 case'disconnect':disconnectModal(t);break;
 case'confirm-disconnect':if(disconnectConflict||t.state==='changed'){conflictModal(t);break}finishDisconnect(t);break;
 case'finish-disconnect':if($('#conflict-choice')?.value)finishDisconnect(t);break;
 case'download':modal('安装 '+t.name,'<p>正式应用会打开工具官方安装页面。安装完成后，返回这里点击「重新检测」。</p><p>这里可以模拟安装完成，再体验接入流程。</p>',button('关闭','close')+button('模拟安装完成','install-demo',t.id,'primary'),t.id);break;
 case'install-demo':t.installed=true;t.state='ready';dialog.close();render();toast('已模拟检测到 '+t.name+'。');break;
 case'detect':inventoryState='loading';render();after(650,()=>{inventoryState='ready';render();toast('检测完成（演示），未读取本机文件。')});break;
 case'clear-search':query='';filter='all';render();break;
 case'balance-retry':balanceError=false;render();toast('余额已更新（演示）。');break;
 case'recharge':externalPage('充值');break;
 case'tokens':externalPage('Token 管理');break;
 case'billing':externalPage('钱包与账单');break;
 case'workspaces':externalPage('空间管理');break;
 case'external-profile':externalPage('个人设置');break;
 case'profile':modal('演示账号','<p>个人用户</p><p>退出桌面账号会保留已有 Agent 的配置。</p>',button('账号与空间','account-nav')+button('退出登录','logout','','quiet danger'));break;
 case'account-nav':dialog.close();setPage('account');break;
 case'switch-account':case'logout':if(dialog.open)dialog.close();signedIn=false;loginState='initial';currentSpace='个人空间';render();break;
 case'login':loginState='waiting';renderLogin();toast('原型正在模拟等待授权，不会打开真实登录页。');break;
 case'reopen':toast('已模拟重新打开浏览器登录页。');break;
 case'copy-link':toast('已模拟复制登录链接。');break;
 case'login-cancel':loginState='initial';renderLogin();break;
 case'preview':preview();break;
 case'apply-preview':applyPreview();break;
 case'spec':spec();break;
 case'reset':clearTimeout(operationTimer);busy=false;tools=structuredClone(initialTools);currentSpace='个人空间';page='tools';selected='claude';filter='all';query='';signedIn=true;loginState='initial';inventoryState='ready';balanceError=false;testOutcome='pass';disconnectConflict=false;if(dialog.open)dialog.close();render();toast('演示数据已重置，外观选择保留。');break;
 }
});
function finishDisconnect(t){t.connected=false;t.state=t.installed?'ready':'missing';t.space=null;disconnectConflict=false;dialog.close();render();toast('已模拟取消 '+t.name+' 的接入，工具安装状态保留。');}
function applyPreview(){const scene=$('#scene').value, toolState=$('#demo-tool-state').value;appearance.density=$('#density').value;appearance.accent=$('#accent').value;testOutcome=$('#demo-test-result').value;applyAppearance();dialog.close();
 if(toolState!=='keep'){const t=toolById(selected);t.connected=true;t.installed=true;t.state=toolState;t.space=t.space||currentSpace;page='detail';signedIn=true;}
 inventoryState='ready';balanceError=false;disconnectConflict=false;
 if(scene==='loading'||scene==='inventory-error'){page='tools';inventoryState=scene==='loading'?'loading':'error';signedIn=true;}
 if(scene==='balance-error'){balanceError=true;signedIn=true;page='account';}
 if(scene.startsWith('login')){signedIn=scene==='login-success';loginState=scene==='login-waiting'?'waiting':scene==='login-error'?'error':'initial';if(signedIn){currentSpace='个人空间';page='tools';toast('已模拟授权成功，进入个人空间。')}}
 if(scene==='normal'&&toolState==='keep'){signedIn=true;loginState='initial';}
 if(scene==='conflict'){disconnectConflict=true;signedIn=true;page='detail';const t=toolById(selected);t.connected=true;t.installed=true;t.space=t.space||currentSpace;if(!['pass','fail','changed','configured'].includes(t.state))t.state='configured';}
 render();
}
document.addEventListener('change',e=>{if(e.target.id==='test-model')$('#confirm-test').disabled=!e.target.value;if(e.target.id==='conflict-choice')$('#confirm-conflict').disabled=!e.target.value});
dialog.addEventListener('cancel',e=>{if(busy)e.preventDefault()});
dialog.addEventListener('click',e=>{if(e.target===dialog&&!busy){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'&&signedIn&&!dialog.open){e.preventDefault();setPage('tools');$('#search-input').focus()}});
$('#brand').src=assets.token.data;applyAppearance();
const route=location.hash.slice(1);if(['account','help','tools'].includes(route))page=route;else if(route.startsWith('tool-')&&toolById(route.slice(5))){page='detail';selected=route.slice(5)}
render();

</script></body></html>
