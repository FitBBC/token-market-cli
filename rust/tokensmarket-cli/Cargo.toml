[package]
name = "tokensmarket-cli"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[[bin]]
name = "tokenmarket"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokensmarket-core = { path = "../tokensmarket-core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace]
