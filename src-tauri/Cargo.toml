[package]
name = "app"
version = "0.1.0"
description = "Token Market Setup"
authors = ["Token Market"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.80"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokensmarket-core = { path = "../rust/tokensmarket-core" }
