<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Token Market</title>
<style>
:root { color-scheme:light; --background:#fafafa; --surface:#fff; --ink:#171717; --muted:#666; --line:#e5e5e5; --error:#b42318; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; color:var(--ink); background:var(--background); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
main { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:48px 24px; }
.brand { font-size:22px; font-weight:650; letter-spacing:-.6px; margin-bottom:64px; }
.panel { width:min(360px,100%); text-align:center; }
h1 { margin:0 0 12px; font-size:28px; font-weight:600; letter-spacing:-.7px; }
p { color:var(--muted); margin:0 0 28px; font-size:14px; }
button { display:block; width:100%; min-height:46px; border:1px solid var(--line); border-radius:10px; font:inherit; font-size:14px; font-weight:550; cursor:pointer; background:var(--surface); color:var(--ink); margin:12px 0; padding:10px 16px; }
button.primary { background:var(--ink); color:var(--surface); border-color:var(--ink); }
button:hover { opacity:.8; }
button:focus-visible { outline:3px solid #93b4ff; outline-offset:3px; }
button:disabled { opacity:.5; cursor:wait; }
button.quiet { border-color:transparent; background:transparent; color:var(--muted); }
#feedback { min-height:44px; margin-top:20px; font-size:13px; overflow-wrap:anywhere; }
#feedback.error { color:var(--error); }
.context { margin-top:24px; padding:24px; border:1px solid var(--line); border-radius:12px; text-align:left; background:var(--surface); }
.context span { display:block; color:var(--muted); font-size:12px; }
.context strong { display:block; font-size:16px; overflow-wrap:anywhere; }
footer { margin-top:64px; color:var(--muted); font-size:12px; }
[hidden] { display:none !important; }
</style>
<link rel="stylesheet" href="tools.css">
</head>
<body>
<main>
<div class="brand">Token Market</div>
<section id="login" class="panel" aria-labelledby="title">
<h1 id="title">登录 Token Market</h1>
<p id="intro">使用浏览器中的账号登录，管理本机的 Agent。</p>
<button id="begin" class="primary">登录</button>
<div id="waiting" hidden>
<p role="status">请在浏览器中完成授权</p>
<button id="reopen" class="primary">打开登录页面</button>
<button id="copy">复制登录链接</button>
<button id="cancel" class="quiet">取消等待</button>
</div>
<div id="feedback" role="status" aria-live="polite"></div>
</section>
<section id="signed-in" class="panel" hidden aria-labelledby="welcome">
<h1 id="welcome">已登录</h1>
<p>已进入默认空间</p>
<div class="context"><span>账号</span><strong id="account"></strong><span>当前空间</span><strong id="workspace"></strong></div>
</section>
<section id="tools-region" hidden aria-label="本机 Agent 工具"></section>
<footer>Token Market · 连接你的 Agent</footer>
</main>
<script src="tools.js"></script>
<script>
const invoke = window.__TAURI__.core.invoke;
const el = id => document.getElementById(id);
let pending = null;
let starting = false;
function feedback(message, isError = false) {
  el('feedback').textContent = message;
  el('feedback').className = isError ? 'error' : '';
}
function render(status) {
  pending = status.pending;
  const signedIn = Boolean(status.context);
  el('login').hidden = signedIn;
  el('signed-in').hidden = !signedIn;
  window.TokenMarketTools?.setAuthenticated(signedIn);
  el('waiting').hidden = !pending && !starting && !status.exchanging;
  el('begin').hidden = Boolean(pending) || starting || Boolean(status.exchanging);
  el('copy').disabled = !pending;
  el('reopen').disabled = !pending;
  if (signedIn) {
    el('account').textContent = status.context.user.name;
    el('workspace').textContent = status.context.default_workspace.name;
  }
  if (status.error) feedback(status.error, true);
}
el('begin').onclick = async () => {
  starting = true;
  feedback('正在打开浏览器…');
  render({ pending:null });
  try { pending = await invoke('begin_desktop_login'); feedback(''); }
  catch (error) { feedback(String(error), true); }
  finally { starting = false; await refresh(); }
};
el('copy').onclick = async () => {
  if (!pending) return;
  try { await navigator.clipboard.writeText(pending.authorize_url); feedback('登录链接已复制'); }
  catch (_) { feedback('复制失败，请点击“打开登录页面”重试', true); }
};
el('reopen').onclick = async () => {
  try { await invoke('reopen_desktop_login'); }
  catch (error) { feedback(String(error), true); }
};
el('cancel').onclick = async () => {
  try { await invoke('cancel_desktop_login'); starting = false; feedback('已取消等待'); await refresh(); }
  catch (error) { feedback(String(error), true); }
};
async function refresh() {
  try { render(await invoke('desktop_login_status')); }
  catch (_) { feedback('无法读取登录状态，请重新打开应用', true); }
}
window.__TAURI__.event.listen('desktop-login-status', event => render(event.payload));
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
